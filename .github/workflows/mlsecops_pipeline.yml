name: MLSecOps Pipeline - Week 08

on:
  push:
    branches: [ week_08 ]
  pull_request:
    branches: [ main ]

jobs:
  mlsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy matplotlib seaborn

      - name: Run data poisoning
        working-directory: week_08
        run: |
          mkdir -p data
          python ../poison_data.py

      - name: Verify poisoned datasets
        working-directory: week_08
        run: |
          echo "=== Checking generated datasets ==="
          ls -lh data/
          python -c "
          import pandas as pd
          for f in ['iris_clean.csv','iris_poisoned_5.csv','iris_poisoned_10.csv','iris_poisoned_50.csv']:
              df = pd.read_csv(f'data/{f}')
              print(f'{f}: {len(df)} rows, {df.shape[1]} cols')
          "

      - name: Train models & log to MLflow
        working-directory: week_08
        run: |
          python ../train_log.py

      - name: Analyze results
        working-directory: week_08
        run: |
          python ../analyze.py

      - name: Verify MLflow experiments
        working-directory: week_08
        run: |
          python -c "
          import mlflow
          runs = mlflow.search_runs(experiment_names=['MLSecOps_IRIS_Poisoning'])
          print(f'Total runs logged: {len(runs)}')
          cols = ['params.poison_level_pct','metrics.accuracy','metrics.f1_score']
          print(runs[cols].sort_values('params.poison_level_pct').to_string(index=False))
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: mlsecops-results
          path: |
            week_08/data/*.png
            week_08/data/*.csv
            week_08/data/*.txt
            week_08/mlruns/
