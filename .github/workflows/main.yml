name: IRIS ML CI/CD with MLflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install scikit-learn pandas numpy joblib pytest mlflow

      - name: Train Model and Log to MLflow
        run: |
          python train.py

      - name: Run Sanity Tests fetching model from MLflow Registry
        run: |
          python -m pytest test_model.py -v 2>&1 | tee test_results.txt

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @dvcorg/cml
          echo "## MLflow CI Test Report" > report.md
          echo "### Test Results" >> report.md
          cat test_results.txt >> report.md
          echo "### MLflow Tracking" >> report.md
          echo "- Tracking URI: sqlite:///mlflow.db" >> report.md
          echo "- Model Registry: IRIS-classifier-rf" >> report.md
          cml comment create report.md

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-report
    if: github.ref == 'refs/heads/week_06' && github.event_name == 'push'

    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iris-repo/iris-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker Image
        run: docker build -t $IMAGE:${{ github.sha }} ./iris-api

      - name: Push to Artifact Registry
        run: docker push $IMAGE:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Deploy to GKE
        run: |
          sed -i "s|iris-api:v2|iris-api:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/iris-api

      - name: Show Live Service IP
        run: kubectl get service iris-service
