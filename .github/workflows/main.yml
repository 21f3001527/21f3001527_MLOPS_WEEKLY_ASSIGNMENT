name: IRIS ML CI/CD with Stress Testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install scikit-learn pandas numpy joblib pytest mlflow

      - name: Train Model and Log to MLflow
        run: |
          python train.py

      - name: Run Sanity Tests
        run: |
          python -m pytest test_model.py -v 2>&1 | tee test_results.txt

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @dvcorg/cml
          echo "## MLflow CI Test Report" > report.md
          echo "### Test Results" >> report.md
          cat test_results.txt >> report.md
          cml comment create report.md

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test-and-report
    if: github.ref == 'refs/heads/week_07' && github.event_name == 'push'
    env:
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iris-repo/iris-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build Docker Image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Push to Artifact Registry
        run: docker push $IMAGE:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Deploy to GKE
        run: |
          sed -i "s|iris-api:v2|iris-api:${{ github.sha }}|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/iris-api

      - name: Show Live Service IP
        run: |
          kubectl get service iris-service
          kubectl get hpa

  stress-test:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/week_07' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Get Service External IP
        run: |
          for i in {1..20}; do
            IP=$(kubectl get service iris-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "EXTERNAL_IP=$IP" >> $GITHUB_ENV
              echo "Found IP: $IP"
              break
            fi
            echo "Attempt $i: waiting 15s..."
            sleep 15
          done
          if [ -z "$IP" ]; then echo "ERROR: No external IP found" && exit 1; fi

      - name: Apply HPA max 3 replicas
        run: kubectl apply -f k8s/hpa.yaml

      - name: Run Stress Test - 1000 Connections (Task 2 and 3)
        run: |
          echo "## Stress Test: 1000 connections, max 3 replicas"
          wrk -t4 -c1000 -d30s --timeout 10s \
            -s stress_test.lua \
            http://$EXTERNAL_IP/predict/ 2>&1 | tee stress_test_1000.txt
          echo "--- HPA status ---"
          kubectl get hpa
          echo "--- Pod status ---"
          kubectl get pods

      - name: Apply constrained HPA max 1 replica
        run: kubectl apply -f k8s/hpa_constrained.yaml

      - name: Wait for HPA to settle
        run: sleep 30

      - name: Run Stress Test - 2000 Connections (Task 5)
        run: |
          echo "## Stress Test: 2000 connections, max 1 replica"
          wrk -t4 -c2000 -d30s --timeout 10s \
            -s stress_test.lua \
            http://$EXTERNAL_IP/predict/ 2>&1 | tee stress_test_2000.txt
          echo "--- HPA status constrained ---"
          kubectl get hpa
          echo "--- Pod status ---"
          kubectl get pods

      - name: Upload Stress Test Results
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            stress_test_1000.txt
            stress_test_2000.txt
