name: IRIS ML CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install pytest scikit-learn numpy joblib

      - name: Train Model
        run: python train.py

      - name: Run Sanity Test
        run: |
          python -m pytest test_model.py -v > test_output.txt 2>&1 || true
          cat test_output.txt

      - name: Post CML Report as Comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install cml
          echo "## 🧪 Sanity Test Report" > report.md
          echo '```' >> report.md
          cat test_output.txt >> report.md
          echo '```' >> report.md
          cml comment create report.md

