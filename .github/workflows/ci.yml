name: IRIS ML CI with MLflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install scikit-learn pandas numpy joblib pytest mlflow

      - name: Train Model and Log to MLflow
        run: |
          python train.py

      - name: Run Sanity Tests fetching model from MLflow Registry
        run: |
          python -m pytest test_model.py -v 2>&1 | tee test_results.txt

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Post CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @dvcorg/cml
          echo "## MLflow CI Test Report" > report.md
          echo "### Test Results" >> report.md
          cat test_results.txt >> report.md
          echo "### MLflow Tracking" >> report.md
          echo "- Tracking URI: sqlite:///mlflow.db" >> report.md
          echo "- Model Registry: IRIS-classifier-rf" >> report.md
          cml comment create report.md
